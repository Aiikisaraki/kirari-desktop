name: Release (kirari-desktop)

# ─────────────────────────────────────────────────────────────────────────────
# 触发方式
#   1) 推送 tag  vX.Y.Z   → 自动打包并发布该版本 Release（覆盖同名旧 Release）
#   2) 手动在 Actions 页面点击 Run workflow
#        - version：可填指定版本（如 0.8.0），留空则用 package.json 当前版本
#        - overwrite：是否覆盖同名旧 Release（默认 true）
#
# 一次构建产出一个安装包（文件名 ASCII，不含中文）：
#   - aki-kirari-pet-setup-X.Y.Z.exe    桌宠版（自带大脑，不含任何后端进程）
#
# 注意：推送到 main 不触发任何构建，避免每次提交都跑 workflow。
#       要发版请打 tag：  git tag vX.Y.Z && git push origin vX.Y.Z
#       或到 Actions 页面手动 Run。
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要打包发布的版本号（如 0.1.2）。留空则使用 package.json 中的 version。"
        required: false
        default: ""
      overwrite:
        description: "若同名版本 Release 已存在，是否覆盖它。"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # 本仓库被检出到 kirari-desktop/ 子目录（为了和 kirari-net 成平级关系，
    # 见下面检出那两步），所以所有 run 步骤都在这个目录里执行。
    defaults:
      run:
        working-directory: kirari-desktop
    steps:
      - name: 检出组网层 (kirari-net)
        # package.json 里是 "kirari-net": "file:../kirari-net" —— 组网层必须与
        # 本仓库**平级**。检出到 workspace 根下的 kirari-net/ 才能满足这个相对路径。
        # 注意：npm ci 对 file: 依赖不校验目标是否存在（缺了只留悬空软链，
        # 安装绿灯、运行时才炸），所以这一步不能省。
        uses: actions/checkout@v4
        with:
          repository: Aiikisaraki/kirari-net
          path: kirari-net

      - name: Checkout frontend (kirari-desktop)
        uses: actions/checkout@v4
        with:
          path: kirari-desktop
          fetch-depth: 0
          # 关键：官方皮肤精灵图走 Git LFS，必须拉取真实二进制。否则安装包里只是 LFS 指针文本，
          # 运行时加载不出任何皮肤形象（历史踩坑：CI 发出的安装包找不到皮肤）。
          lfs: true

      - name: Build networking layer (kirari-net)
        # 主进程会把 kirari-net 打进来，需要它的 dist + 类型声明先就位。
        working-directory: kirari-net
        run: |
          npm install --no-audit --no-fund
          npm run build
          node -e "require('./'); console.log('kirari-net ok')"

      # 防御性校验：确保 official-avatars 下是真实图片而非 LFS 指针残留。
      # 若 CI 没拉到 LFS 对象，这里直接让构建失败，避免再次发出"无皮肤"的安装包。
      - name: Verify official-avatars are real (not LFS pointers)
        shell: bash
        run: |
          echo "Checking resources/official-avatars for LFS pointer stubs..."
          bad=0
          for f in $(find resources/official-avatars -type f \( -name '*.png' -o -name '*.webp' -o -name '*.gif' \)); do
            if head -c 64 "$f" | grep -q "git-lfs"; then
              echo "LFS POINTER DETECTED: $f"; bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "ERROR: Git LFS files were not pulled. Installer would ship broken avatars."
            exit 1
          fi
          echo "All official-avatars assets are real binaries."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kirari-desktop/package-lock.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(node -p "require('./package.json').version")
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VER (tag v$VER)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & package Windows installer
        env:
          # 组网密钥**不需要在构建期注入**：两端都不带密钥出厂，
          # 密钥由每台设备在运行时自己解决（当主机自签 / 当叶子配对期领取）。
          # 所以这里没有 KIRARI_NET_SECRET 这个 Secret，也没有任何密钥进产物。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      # 覆盖同名旧 Release：删除旧的 release 与 tag
      - name: Delete existing same-version release (overwrite)
        if: github.event.inputs.overwrite == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes || true
          git push --delete origin "$TAG" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # 路径相对 workspace 根（uses 步骤不受 defaults.run.working-directory 影响）
          files: kirari-desktop/release/*Setup*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
